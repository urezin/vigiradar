<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VigiEye — Your PV command center</title>
<meta name="description" content="VigiEye is a modular pharmacovigilance platform. Turn on regulatory monitoring, compliance, medical monitoring and literature surveillance — the modules you actually need.">
<style>
  :root{
    --navy:#0b2942;--navy-2:#12395a;--sky:#0ea5e9;--cyan:#22d3ee;--ink:#0b2942;--ink-2:#33465e;
    --muted:#6b7a90;--line:#dbe7f3;--bg:#f4f8fc;--card:#fff;--brand:#0ea5e9;--brand-700:#0284c7;--brand-050:#e7f5fe;
    --green:#0f9d58;--amber:#d97706;--red:#e11d48;
    --radius:14px;--shadow:0 1px 2px rgba(11,41,66,.06),0 10px 30px rgba(11,41,66,.08);
    --shadow-lg:0 16px 46px rgba(11,41,66,.18);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-family:inherit;
    font-weight:650;font-size:14.5px;border-radius:10px;padding:10px 16px;transition:.15s;line-height:1}
  .btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-700)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-ghost:hover{border-color:var(--muted)}
  .btn-white{background:#fff;color:var(--brand-700)}.btn-white:hover{background:#e7f5fe}
  .btn-sm{padding:7px 12px;font-size:13px}.btn-lg{padding:13px 22px;font-size:15px}
  input,select{font-family:inherit;font-size:14px}

  header{height:60px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:0 22px;position:sticky;top:0;z-index:30}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.3px}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--sky));display:grid;place-items:center;font-size:16px}
  .logo b{color:var(--cyan)}
  .spacer{flex:1}
  .acct{position:relative}
  .avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;font-weight:800;cursor:pointer}
  .menu{position:absolute;right:0;top:46px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);min-width:220px;padding:8px;display:none}
  .menu.open{display:block}.menu .mi{display:block;padding:9px 12px;border-radius:8px;font-size:14px;cursor:pointer}
  .menu .mi:hover{background:var(--bg)}.menu .sep{height:1px;background:var(--line);margin:6px 4px}

  .shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 60px)}
  .side{background:#fff;border-right:1px solid var(--line);padding:16px 12px}
  .side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 8px 6px;font-weight:750}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--ink-2)}
  .nav-item:hover{background:var(--bg)}
  .nav-item.active{background:var(--brand-050);color:var(--brand-700)}
  .nav-item .ico{width:22px;text-align:center}
  .nav-item.locked{color:var(--muted)}.nav-item .lk{margin-left:auto;font-size:12px;opacity:.6}
  main{padding:26px 30px;max-width:1180px}
  .page-h{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .page-h h1{font-size:26px;letter-spacing:-.5px;margin:0}
  .page-h p{margin:4px 0 0;color:var(--muted);font-size:14.5px}

  .mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  .mod{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .mod.owned{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand-050)}
  .mod .ic{font-size:32px}
  .mod h3{margin:10px 0 4px;font-size:18px}
  .mod .tl{color:var(--muted);font-size:14px;margin:0 0 12px}
  .mod ul{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:7px}
  .mod li{font-size:13.5px;color:var(--ink-2);display:flex;gap:8px}.mod li .ck{color:var(--green);font-weight:900}
  .mod .tag{display:inline-block;background:var(--brand-050);color:var(--brand-700);font-size:11.5px;font-weight:750;padding:3px 9px;border-radius:11px;margin-bottom:12px;align-self:flex-start}
  .mod .core{background:#eafaf0;color:#0b7a43}
  .mod .btnrow{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
  .stat-row{display:flex;gap:22px;flex-wrap:wrap;padding:2px 0 4px}
  .stat-row .s b{font-size:20px;font-weight:800}.stat-row .s span{font-size:12.5px;color:var(--muted)}
  .owned-tag{display:inline-flex;align-items:center;gap:6px;color:var(--brand-700);font-weight:750;font-size:14px}

  .plan-band{background:linear-gradient(120deg,var(--navy),#14406a);color:#fff;border-radius:16px;padding:22px 26px;display:flex;
    align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
  .plan-band h3{margin:0 0 3px;font-size:19px}.plan-band p{margin:0;color:#bfe0f2;font-size:14px}
  .plan-band .prices{display:flex;gap:20px;align-items:center}
  .plan-band .pr b{font-size:20px}.plan-band .pr span{font-size:12px;color:#bfe0f2;display:block}

  /* landing (signed out) */
  .land{max-width:1120px;margin:0 auto;padding:44px 22px}
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:20px 0 46px}
  .hero h1{font-size:44px;line-height:1.08;letter-spacing:-1.2px;margin:0 0 16px}
  .hero h1 span{color:var(--brand)}
  .hero p{font-size:18px;color:var(--ink-2);margin:0 0 24px;max-width:42ch}
  .hero-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:20px}
  .hero-card .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-weight:600}
  .hero-card .row:first-of-type{border-top:0}
  .hero-card .row .i{width:34px;height:34px;border-radius:9px;background:var(--brand-050);display:grid;place-items:center;font-size:18px}
  .hero-card .row small{margin-left:auto;color:var(--muted);font-weight:600}

  .overlay{position:fixed;inset:0;background:rgba(8,20,32,.55);backdrop-filter:blur(3px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);padding:28px;position:relative}
  .modal-x{position:absolute;top:14px;right:16px;font-size:24px;color:var(--muted);cursor:pointer;line-height:1}
  .modal h2{margin:0 0 4px;font-size:22px}.modal .swi{color:var(--muted);font-size:14px;margin:0 0 18px}.modal .swi a{color:var(--brand);font-weight:650;cursor:pointer}
  .oauth-btn{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:650;font-size:15px;cursor:pointer;font-family:inherit;margin-bottom:10px}
  .oauth-btn:hover{background:var(--bg)}
  .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:14px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px;color:var(--ink-2)}
  .field input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px}
  .field input:focus{outline:none;border-color:var(--brand)}
  .err{background:#fdecea;color:#c0392b;border-radius:8px;padding:9px 12px;font-size:13.5px;margin-bottom:12px;display:none}.err.show{display:block}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:var(--shadow-lg);z-index:80;display:none;max-width:90vw}.toast.show{display:block}
  @media(max-width:860px){.shell{grid-template-columns:1fr}.side{display:none}.hero{grid-template-columns:1fr}.hero-card{display:none}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/hub"><span class="mark">👁️</span>Vigi<b>Eye</b></a>
  <div class="spacer"></div>
  <div id="topauth"></div>
</header>
<div id="root"></div>
<div class="toast" id="toast"></div>

<div class="overlay" id="authOverlay" onclick="if(event.target===this)closeAuth()">
  <div class="modal">
    <span class="modal-x" onclick="closeAuth()">×</span>
    <h2 id="authTitle">Create your account</h2>
    <p class="swi" id="authSwitch"></p>
    <div class="err" id="authErr"></div>
    <div id="oauthArea"></div>
    <div class="divider" id="authDivider">or with email</div>
    <form id="authForm" onsubmit="return submitAuth(event)">
      <div class="field" id="nameField"><label>Your name</label><input id="f_name" type="text" placeholder="Jane Doe"></div>
      <div class="field"><label>Work email</label><input id="f_email" type="email" required placeholder="you@company.com"></div>
      <div class="field"><label>Password</label><input id="f_pass" type="password" required minlength="8" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-lg" style="width:100%" id="authSubmit">Create account</button>
    </form>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
let ME=null, PROV={email:true}, VIEW="dashboard", STATUS={};
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),3000);}
async function api(p,o){const r=await fetch(p,Object.assign({headers:{"Content-Type":"application/json"}},o));let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,status:r.status,data:j};}

// Module catalog — Monitoring is the always-on core; the rest are add-ons.
const MODULES=[
  {key:"monitoring",name:"Regulatory Monitoring",icon:"📡",core:true,open:"/app",
   tagline:"EMA, EUR-Lex and all 27 national agencies — AI-summarised, filtered to your markets.",
   features:["Real-time alerts & weekly digest","Filter by country, subject & product","Inspection-ready audit trail"]},
  {key:"compliance",name:"Compliance Register",icon:"✅",open:"/compliance",
   status:"/api/compliance/status",activate:"/api/compliance/activate",summary:"/api/compliance/summary",
   tagline:"Turn the regulatory feed into action — obligations, deadlines & sign-off.",
   features:["GVP/GMP obligation register","Overdue & due-soon alerts","Attestation sign-off & audit trail"]},
  {key:"medical",name:"Medical Monitoring",icon:"🩺",open:"/medical-monitoring",
   status:"/api/mm/status",activate:"/api/mm/activate",summary:"/api/mm/summary",
   tagline:"Case-safety medical review with expedited reporting clocks.",
   features:["ICSR caseload & review workflow","15/90-day reporting clocks","Causality & query tracking"]},
  {key:"literature",name:"Literature Monitoring",icon:"📚",open:"/medical-literature",
   status:"/api/lit/status",activate:"/api/lit/activate",summary:"/api/lit/summary",
   tagline:"GVP VI literature surveillance — screen PubMed, Embase & journals.",
   features:["Reference screening worklist","Adverse-event & relevance flags","Escalate to an ICSR"]},
];
const MOD=k=>MODULES.find(m=>m.key===k);
function owned(k){const m=MOD(k);return m.core || !!(STATUS[k]&&STATUS[k].active);}

async function boot(){
  const [me,prov]=await Promise.all([api("/api/me"),api("/auth/providers")]);
  ME = (me.ok && me.data.authenticated) ? me.data.user : null;
  if(prov.ok) PROV=prov.data;
  renderTop();
  if(!ME){ renderLanding(); return; }
  await loadStatuses();
  renderShell();
}
async function loadStatuses(){
  const addons=MODULES.filter(m=>!m.core);
  const res=await Promise.all(addons.map(m=>api(m.status)));
  addons.forEach((m,i)=>{ STATUS[m.key]=res[i].ok?res[i].data:{active:false}; });
}

/* ---------- top bar ---------- */
function renderTop(){
  const el=$("#topauth");
  if(ME){
    const ini=(ME.name||ME.email||"?").slice(0,1).toUpperCase();
    el.innerHTML=`<div class="acct"><div class="avatar" onclick="document.getElementById('am').classList.toggle('open')">${ini}</div>
      <div class="menu" id="am">
        <div style="padding:8px 12px;font-size:13px;color:var(--muted)">${esc(ME.email||"")}</div>
        <div class="sep"></div><div class="mi" onclick="go('modules')">Modules</div>
        <a class="mi" href="/api/logout">Log out</a></div></div>`;
  } else {
    el.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="openAuth('login')">Log in</button>
      <button class="btn btn-primary btn-sm" onclick="openAuth('register')">Get started</button>`;
  }
}
document.addEventListener("click",e=>{const m=$("#am");if(m&&!e.target.closest(".acct"))m.classList.remove("open");});

/* ---------- landing (signed out) ---------- */
function renderLanding(){
  $("#root").innerHTML=`
  <div class="land">
    <div class="hero">
      <div>
        <h1>One eye on <span>everything</span> that moves in pharmacovigilance.</h1>
        <p>VigiEye is a modular PV platform. Turn on regulatory monitoring, compliance, medical monitoring and literature surveillance — only the modules you need.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary btn-lg" onclick="openAuth('register')">Start free</button>
          <button class="btn btn-ghost btn-lg" onclick="document.getElementById('store').scrollIntoView({behavior:'smooth'})">See modules</button>
        </div>
      </div>
      <div class="hero-card">
        ${MODULES.map(m=>`<div class="row"><span class="i">${m.icon}</span>${esc(m.name)}<small>${m.core?'Core':'Add-on'}</small></div>`).join("")}
      </div>
    </div>
    <div id="store">
      <h2 style="font-size:26px;letter-spacing:-.5px;margin:8px 0 4px">Your PV modules</h2>
      <p style="color:var(--muted);margin:0 0 20px">Each works on its own. Add more any time.</p>
      <div class="mods">${MODULES.map(m=>modCard(m,false)).join("")}</div>
    </div>
  </div>`;
}
function modCard(m, isOwned){
  const tag = m.core?'<span class="tag core">✓ Core module</span>'
    : (isOwned?'<span class="tag">✓ Active</span>':'<span class="tag">Included with Pro</span>');
  let btn;
  if(m.core) btn = ME?`<a class="btn btn-primary" href="${m.open}">Open</a>`:`<button class="btn btn-primary" onclick="openAuth('register')">Start free</button>`;
  else if(isOwned) btn = `<a class="btn btn-primary" href="${m.open}">Open</a>`;
  else btn = ME?`<button class="btn btn-primary" onclick="activate('${m.key}')">Activate</button>`:`<button class="btn btn-primary" onclick="openAuth('register')">Activate</button>`;
  return `<div class="mod ${isOwned||m.core?'owned':''}">
    <div class="ic">${m.icon}</div>${tag}
    <h3>${esc(m.name)}</h3><p class="tl">${esc(m.tagline)}</p>
    <ul>${m.features.map(f=>`<li><span class="ck">✓</span>${esc(f)}</li>`).join("")}</ul>
    <div class="btnrow">${btn}</div></div>`;
}

/* ---------- shell (signed in) ---------- */
function renderShell(){
  const nav=MODULES.map(m=>{
    const own=owned(m.key);
    return `<div class="nav-item ${VIEW===m.key?'active':''} ${own?'':'locked'}" onclick="openModule('${m.key}')">
      <span class="ico">${m.icon}</span>${esc(m.name)}${own?'':'<span class="lk">🔒</span>'}</div>`;
  }).join("");
  $("#root").innerHTML=`
  <div class="shell">
    <aside class="side">
      <div class="grp">Overview</div>
      <div class="nav-item ${VIEW==='dashboard'?'active':''}" onclick="go('dashboard')"><span class="ico">🏠</span>Dashboard</div>
      <div class="grp">Modules</div>
      ${nav}
      <div class="grp">Account</div>
      <div class="nav-item ${VIEW==='modules'?'active':''}" onclick="go('modules')"><span class="ico">🧩</span>All modules</div>
    </aside>
    <main id="main"></main>
  </div>`;
  renderView();
}
function go(v){VIEW=v;renderShell();}
function openModule(k){ if(owned(k)){ location.href=MOD(k).open; } else { VIEW=k; renderShell(); } }

function renderView(){
  if(VIEW==="dashboard") return renderDashboard();
  if(VIEW==="modules") return renderStore();
  const m=MOD(VIEW);
  if(m && !owned(m.key)) return renderLocked(m);
  if(m){ location.href=m.open; return; }
  renderDashboard();
}
async function renderDashboard(){
  const first=(ME.name||ME.email||"").split(" ")[0]||"";
  let cards="";
  for(const m of MODULES){
    if(!owned(m.key)) continue;
    let stats="";
    if(m.summary){
      const s=(await api(m.summary)).data||{};
      const bits=Object.entries(s).filter(([k,v])=>typeof v==="number").slice(0,3)
        .map(([k,v])=>`<div class="s"><b>${v}</b> <span>${k.replace(/_/g,' ')}</span></div>`).join("");
      stats=`<div class="stat-row">${bits||'<span style="color:var(--muted)">No data yet</span>'}</div>`;
    } else {
      stats=`<div class="stat-row"><span style="color:var(--muted);font-size:13.5px">Live regulatory feed across the EU</span></div>`;
    }
    cards+=`<div class="mod owned"><div class="ic">${m.icon}</div>
      <h3 style="margin-top:8px">${esc(m.name)}</h3>${stats}
      <div class="btnrow"><a class="btn btn-primary btn-sm" href="${m.open}">Open ${esc(m.name.split(' ')[0])}</a></div></div>`;
  }
  const lockedCount=MODULES.filter(m=>!owned(m.key)).length;
  $("#main").innerHTML=`
    <div class="page-h"><div><h1>Welcome${first?', '+esc(first):''} 👋</h1>
      <p>${MODULES.filter(m=>owned(m.key)).length} module(s) active${lockedCount?` · ${lockedCount} available to add`:''}.</p></div>
      <button class="btn btn-primary" onclick="go('modules')">＋ Add modules</button></div>
    ${planBand()}
    <div class="mods">${cards}</div>`;
}
function planBand(){
  const paid = ME && ME.plan && ME.plan!=="" && ME.plan!=="free" && (ME.plan_status==="active"||ME.plan_status==="trialing");
  if(paid) return `<div class="plan-band"><div><h3>You're on a paid plan ✓</h3><p>All modules included. Manage billing anytime.</p></div>
    <a class="btn btn-white" href="/app">Open monitoring</a></div>`;
  return `<div class="plan-band"><div><h3>Unlock everything with Pro</h3><p>All modules, alerts and the inspection-ready trail.</p></div>
    <div class="prices"><div class="pr"><b>€249</b><span>Pro / user / mo</span></div><div class="pr"><b>€199</b><span>Team / mo · annual</span></div>
    <a class="btn btn-white" href="/welcome#pricing">See plans</a></div></div>`;
}
function renderStore(){
  $("#main").innerHTML=`
    <div class="page-h"><div><h1>Modules</h1><p>Activate the PV capabilities you need. Turn more on any time.</p></div></div>
    ${planBand()}
    <div class="mods">${MODULES.map(m=>modCard(m,owned(m.key))).join("")}</div>`;
}
function renderLocked(m){
  $("#main").innerHTML=`<div class="page-h"><div><h1>${m.icon} ${esc(m.name)}</h1><p>${esc(m.tagline)}</p></div></div>
    <div class="mod" style="max-width:520px"><div class="ic">${m.icon}</div>
      <h3 style="margin-top:8px">Activate ${esc(m.name)}</h3><p class="tl">${esc(m.tagline)}</p>
      <ul>${m.features.map(f=>`<li><span class="ck">✓</span>${esc(f)}</li>`).join("")}</ul>
      <div class="btnrow"><button class="btn btn-primary" onclick="activate('${m.key}')">Activate module</button></div></div>`;
}
async function activate(key){
  if(!ME){ pending=key; openAuth('register'); return; }
  const m=MOD(key);
  const {ok,data}=await api(m.activate,{method:"POST"});
  if(ok&&data.active){ toast(`${m.name} activated ✓`); STATUS[key]={active:true}; VIEW=key; renderShell(); setTimeout(()=>location.href=m.open,600); }
  else toast(data.error||"Couldn't activate.");
}

/* ---------- auth ---------- */
let authMode="register",pending=null;
function openAuth(mode){
  authMode=mode;$("#authErr").classList.remove("show");
  $("#authTitle").textContent=mode==="register"?"Create your account":"Welcome back";
  $("#nameField").style.display=mode==="register"?"block":"none";
  $("#authSubmit").textContent=mode==="register"?"Create account":"Log in";
  $("#authSwitch").innerHTML=mode==="register"?`Already have an account? <a onclick="openAuth('login')">Log in</a>`:`New here? <a onclick="openAuth('register')">Create one</a>`;
  let oa=""; if(PROV.google) oa+=`<button class="oauth-btn" onclick="location.href='/auth/login/google'"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.8 6c1.9-5.6 7.1-9.8 13.7-9.8z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7c4.3-4 6.8-9.9 6.8-17.4z"/><path fill="#FBBC05" d="M10.3 28.3c-.5-1.4-.7-2.9-.7-4.3s.3-3 .7-4.3l-7.8-6C.9 16.9 0 20.3 0 24s.9 7.1 2.5 10.3l7.8-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.4-5.7c-2 1.4-4.7 2.3-7.8 2.3-6.6 0-11.8-4.2-13.7-9.8l-7.8 6C6.4 42.6 14.6 48 24 48z"/></svg> Continue with Google</button>`;
  if(PROV.microsoft) oa+=`<button class="oauth-btn" onclick="location.href='/auth/login/microsoft'">⊞ Continue with Microsoft</button>`;
  $("#oauthArea").innerHTML=oa; $("#authDivider").style.display=oa?"flex":"none";
  $("#authOverlay").classList.add("open");
}
function closeAuth(){$("#authOverlay").classList.remove("open");pending=null;}
async function submitAuth(e){
  e.preventDefault();const err=$("#authErr");err.classList.remove("show");
  const email=$("#f_email").value.trim(),pass=$("#f_pass").value,name=$("#f_name").value.trim();
  const path=authMode==="register"?"/auth/register":"/auth/login";
  const body=authMode==="register"?{email,password:pass,name}:{email,password:pass};
  $("#authSubmit").disabled=true;
  const {ok,data}=await api(path,{method:"POST",body:JSON.stringify(body)});
  $("#authSubmit").disabled=false;
  if(!ok){err.textContent=data.error||"Something went wrong.";err.classList.add("show");return false;}
  closeAuth(); const act=pending; pending=null;
  await boot();
  if(act) activate(act);
  return false;
}
boot();
</script>
