name: ISPOR probe (temporary)
on:
  push:
    branches: [probe-ispor]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/ispor.py
      - run: |
          git config user.name "probe-bot"; git config user.email "noreply@github.com"
          git add -f probe/out5 && git commit -m "ispor probe [skip ci]" && git push
