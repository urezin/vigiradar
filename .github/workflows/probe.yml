name: Data probe (temporary)
on:
  push:
    branches: [probe-data-sources]
    paths: [probe/probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: |
          mkdir -p probe/out && cp -r out/* probe/out/
          git config user.name "probe-bot"; git config user.email "noreply@github.com"
          git add probe/out && git commit -m "probe results" && git push
