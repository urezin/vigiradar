name: HTML agency probe (temporary)
on:
  push:
    branches: [probe-html]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q httpx
      - run: python3 probe/scan_pages.py
      - run: |
          git config user.name "probe-bot"; git config user.email "noreply@github.com"
          git add -f probe/out7 && git commit -m "html probe [skip ci]" && git push
