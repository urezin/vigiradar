name: News refresh every 2 hours

# Keeps VigiEye and CompePharma current without anyone touching them:
#  - every 2 hours: regulator and national agency feeds, SEC company releases,
#    guidelines, PRAC/recall notices, ClinicalTrials.gov, then VigiEye writes the stories (step "news")
#  - then warms CompePharma so its 10-minute cache picks up the new stories
# The heavier daily job (EMA/FDA/SEC data, analyses, articles, email) is portal-daily.yml.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: portal-refresh
  cancel-in-progress: false

env:
  BASE_URL: "https://vigi-eye.com"
  COMPEPHARMA_URL: "https://compedpharma.onrender.com"

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app/relay.py
          sparse-checkout-cone-mode: false
      - name: Relay sources that block the server (Federal Register)
        continue-on-error: true
        run: |
          python3 app/relay.py | while IFS=$'\t' read -r key url; do
            if curl -sS --fail --max-time 90 -A "VigiEye regulatory monitor (+https://vigi-eye.com)" "$url" -o /tmp/r.json; then
              curl -sS --max-time 120 -X POST "$BASE_URL/admin/portal/relay/$key" -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
                -H "Content-Type: application/json" --data-binary @/tmp/r.json; echo
            fi
          done
      - name: Start news refresh
        run: |
          curl -sS --max-time 120 --retry 3 --retry-delay 30 --retry-all-errors \
            -X POST "$BASE_URL/admin/portal/run?steps=news" -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" || true
      - name: Wait for it to finish
        run: |
          for i in $(seq 1 70); do
            sleep 30
            s=$(curl -sS --max-time 60 "$BASE_URL/admin/portal/status" -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" || echo '{}')
            running=$(echo "$s" | python3 -c "import sys,json;print(json.load(sys.stdin).get('job',{}).get('running'))" 2>/dev/null || echo "?")
            echo "check $i: running=$running"
            [ "$running" = "False" ] && { echo "$s" > /tmp/status.json; exit 0; }
          done
          echo "::warning::refresh still running; it will finish on the server"
      - name: Save run summary (branch run-status)
        if: always()
        run: |
          [ -f /tmp/status.json ] || exit 0
          git init -q st && cd st && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin run-status 2>/dev/null && git checkout -q -b run-status FETCH_HEAD || git checkout -q --orphan run-status
          python3 -c "import json;d=json.load(open('/tmp/status.json'));json.dump(d.get('job',{}),open('news.json','w'),indent=1)"
          git config user.name "status-bot"; git config user.email "noreply@github.com"
          git add news.json && git commit -qm "news run summary [skip ci]" && git push -q origin run-status || true
      - name: Warm CompePharma
        run: |
          curl -sS -o /dev/null -w "CompePharma %{http_code}\n" --max-time 120 --retry 2 "$COMPEPHARMA_URL/" || true
          curl -sS -o /dev/null -w "VigiEye %{http_code}\n" --max-time 60 "$BASE_URL/" || true
