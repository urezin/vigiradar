name: Portal daily refresh + VigiEye & CompePharma Daily emails

# Every day 04:40 UTC (07:40 Athens):
#   1. refresh EMA / FDA / SEC / Federal Register data, regulatory news and AI analyses
#      (Mondays also write the weekly "week in review" insight)
#   2. on weekdays, send VigiEye Daily and CompePharma Daily to subscribers
#   3. every day, send both to the owner (OWNER_EMAIL secret)
#   Articles: 10 VigiEye + 10 CompePharma a day (step "articles")
# Needs the ADMIN_TOKEN repository secret (same value as on Render). AI analysis and
# PDUFA drug-name extraction need ANTHROPIC_API_KEY on Render; emails need RESEND_API_KEY.

on:
  schedule:
    - cron: "40 4 * * *"   # 07:40 Athens: full refresh + analyses + articles + email
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps to run (ingest,news,analyse,articles,week)"
        default: "ingest,news,analyse,articles"
      send:
        description: "Send the daily email (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: portal-refresh
  cancel-in-progress: false

env:
  BASE_URL: "https://vigi-eye.com"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Start refresh
        run: |
          STEPS="${{ github.event.inputs.steps }}"
          if [ -z "$STEPS" ]; then
            STEPS="ingest,news,analyse,articles"
            [ "$(date -u +%u)" = "1" ] && STEPS="$STEPS,week"
          fi
          echo "steps: $STEPS"
          curl -sS --fail-with-body --max-time 120 --retry 3 --retry-delay 30 --retry-all-errors \
            -X POST "$BASE_URL/admin/portal/run?steps=$STEPS" -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}"
      - name: Wait for it to finish
        run: |
          for i in $(seq 1 160); do
            sleep 30
            s=$(curl -sS --max-time 60 "$BASE_URL/admin/portal/status" -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" || echo '{}')
            running=$(echo "$s" | python3 -c "import sys,json;print(json.load(sys.stdin).get('job',{}).get('running'))" 2>/dev/null || echo "?")
            echo "check $i: running=$running"
            if [ "$running" = "False" ]; then echo "$s" > /tmp/status.json; echo "$s" | python3 -m json.tool | head -120; exit 0; fi
          done
          echo "::error::refresh did not finish in time"; exit 1
      - name: Save run summary (branch run-status)
        if: always()
        run: |
          [ -f /tmp/status.json ] || exit 0
          git init -q st && cd st && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin run-status 2>/dev/null && git checkout -q -b run-status FETCH_HEAD || git checkout -q --orphan run-status
          python3 -c "import json;d=json.load(open('/tmp/status.json'));json.dump(d.get('job',{}),open('daily.json','w'),indent=1)"
          git config user.name "status-bot"; git config user.email "noreply@github.com"
          git add daily.json && git commit -qm "daily run summary [skip ci]" && git push -q origin run-status || true
      - name: Send VigiEye Daily
        run: |
          SEND="${{ github.event.inputs.send }}"
          if [ -z "$SEND" ]; then
            SEND=false; [ "$(date -u +%u)" -le 5 ] && SEND=true
          fi
          DRY=true; [ "$SEND" = "true" ] && DRY=false
          curl -sS --fail-with-body --max-time 900 -X POST "$BASE_URL/admin/portal/send-daily?dry_run=$DRY" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}"
          curl -sS --fail-with-body --max-time 900 -X POST "$BASE_URL/admin/portal/send-cp-daily?dry_run=$DRY" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}"
      - name: Owner's morning briefing (both newsletters, every day)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.send == 'true' }}
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          curl -sS --fail-with-body --max-time 300 -X POST -G "$BASE_URL/admin/portal/send-owner" \
            --data-urlencode "email=$OWNER_EMAIL" -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}"
