name: Portal daily refresh + VigiEye Daily email

# Every day 04:40 UTC (07:40 Athens):
#   1. refresh EMA / FDA / SEC / Federal Register data, regulatory news and AI analyses
#      (Mondays also write the weekly "week in review" insight)
#   2. on weekdays, send VigiEye Daily to daily subscribers
# Needs the ADMIN_TOKEN repository secret (same value as on Render). AI analysis and
# PDUFA drug-name extraction need ANTHROPIC_API_KEY on Render; emails need RESEND_API_KEY.

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps to run (ingest,news,analyse,articles,week)"
        default: "ingest,news,analyse,articles"
      send:
        description: "Send the daily email (true/false)"
        default: "false"

env:
  BASE_URL: "https://vigi-eye.com"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Start refresh
        run: |
          STEPS="${{ github.event.inputs.steps }}"
          if [ -z "$STEPS" ]; then
            STEPS="ingest,news,analyse,articles"
            [ "$(date -u +%u)" = "1" ] && STEPS="$STEPS,week"
          fi
          echo "steps: $STEPS"
          curl -sS --fail-with-body --max-time 120 --retry 3 --retry-delay 30 --retry-all-errors \
            -X POST "$BASE_URL/admin/portal/run?steps=$STEPS" -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}"
      - name: Wait for it to finish
        run: |
          for i in $(seq 1 100); do
            sleep 30
            s=$(curl -sS --max-time 60 "$BASE_URL/admin/portal/status" -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" || echo '{}')
            running=$(echo "$s" | python3 -c "import sys,json;print(json.load(sys.stdin).get('job',{}).get('running'))" 2>/dev/null || echo "?")
            echo "check $i: running=$running"
            if [ "$running" = "False" ]; then echo "$s" | python3 -m json.tool | head -120; exit 0; fi
          done
          echo "::error::refresh did not finish in time"; exit 1
      - name: Send VigiEye Daily
        run: |
          SEND="${{ github.event.inputs.send }}"
          if [ -z "$SEND" ]; then
            SEND=false; [ "$(date -u +%u)" -le 5 ] && SEND=true
          fi
          DRY=true; [ "$SEND" = "true" ] && DRY=false
          curl -sS --fail-with-body --max-time 900 -X POST "$BASE_URL/admin/portal/send-daily?dry_run=$DRY" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}"
